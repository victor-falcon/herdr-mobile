name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests run real scratch hc cores.
      - name: Install hc
        run: |
          curl -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  update-changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the pushed commits
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$AFTER" -- . ':(exclude)*.md'; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  apk:
    name: Build and release the APK
    runs-on: ubuntu-latest
    needs: [check, update-changes]
    if: needs.update-changes.outputs.relevant == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: apk-release
      cancel-in-progress: false
    env:
      # Above the versionCode of any APK built by hand, so the first release installs over it.
      HERDR_BUILD: ${{ github.run_number }}00
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HERDR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/release.keystore"
          {
            echo "storeFile=$dir/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=herdr-mobile"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > "$dir/signing.properties"
          echo "HERDR_SIGNING=$dir/signing.properties" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a -x lintVitalAnalyzeRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="herdr-mobile-$HERDR_BUILD.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "build-$HERDR_BUILD" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Build $HERDR_BUILD" \
            --notes "$(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))"
